<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Lookup</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 20px;
      font-weight: 600;
    }

    #searchBox {
      width: 300px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      margin-bottom: 20px;
    }

    #results {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .resultItem {
      background: #222;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .resultItem:hover {
      background: #333;
    }

    #details {
      width: 360px;
      background: #222;
      padding: 20px;
      border-radius: 10px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #detailsPoster {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    #detailsTitle {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    #detailsYear {
      font-size: 18px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    #detailsRating,
    #detailsRuntime,
    #detailsGenres,
    #detailsCast,
    #detailsPlot {
      font-size: 16px;
      line-height: 1.4;
      opacity: 0.9;
      margin-top: 10px;
    }

    #error {
      margin-top: 20px;
      color: #ff6b6b;
      font-size: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Movie Lookup</h1>

  <input id="searchBox" type="text" placeholder="Search for a movie…">

  <div id="results"></div>

  <div id="details">
    <img id="detailsPoster" src="" alt="Poster">
    <div id="detailsTitle"></div>
    <div id="detailsYear"></div>
    <div id="detailsRating"></div>
    <div id="detailsRuntime"></div>
    <div id="detailsGenres"></div>
    <div id="detailsCast"></div>
    <div id="detailsPlot"></div>
  </div>

  <div id="error"></div>

  <script>
    const input = document.getElementById("searchBox");
    const resultsBox = document.getElementById("results");
    const detailsBox = document.getElementById("details");
    const errorBox = document.getElementById("error");

    input.addEventListener("keyup", async (e) => {
      const title = e.target.value.trim();
      resultsBox.innerHTML = "";
      errorBox.style.display = "none";

      if (!title) {
        detailsBox.style.display = "none";
        return;
      }

      try {
        const res = await fetch(`/api/movie?title=${encodeURIComponent(title)}`);
        const data = await res.json();

        if (!data.ok) {
          errorBox.textContent = data.error;
          errorBox.style.display = "block";
          detailsBox.style.display = "none";
          return;
        }

        const item = document.createElement("div");
        item.className = "resultItem";
        item.textContent = `${data.title} (${data.year || "?"})`;

        item.onclick = async () => {
          document.getElementById("detailsPoster").src = data.poster || "";
          document.getElementById("detailsTitle").textContent = data.title;
          document.getElementById("detailsYear").textContent = data.year || "Unknown";

          // Fetch full details
          const detailsRes = await fetch(`https://v2.sg.media-imdb.com/titles/${data.id}/details`);
          const detailsJson = await detailsRes.json();

          const plotRes = await fetch(`https://v2.sg.media-imdb.com/titles/${data.id}/plots`);
          const plotJson = await plotRes.json();

          // Plot
          let plot = "No plot summary available.";
          if (plotJson?.plots?.length > 0 && plotJson.plots[0].text) {
            plot = plotJson.plots[0].text;
          }
          document.getElementById("detailsPlot").textContent = plot;

          // Cast
          let cast = "No cast info.";
          if (detailsJson?.credits?.cast?.length > 0) {
            cast = "Cast: " + detailsJson.credits.cast.slice(0, 5).map(c => c.name).join(", ");
          }
          document.getElementById("detailsCast").textContent = cast;

          // Genres
          let genres = "Genres: Unknown";
          if (detailsJson?.genres?.length > 0) {
            genres = "Genres: " + detailsJson.genres.join(", ");
          }
          document.getElementById("detailsGenres").textContent = genres;

          // Runtime
          let runtime = "Runtime: Unknown";
          if (detailsJson?.runtime?.seconds) {
            const mins = Math.round(detailsJson.runtime.seconds / 60);
            runtime = `Runtime: ${mins} min`;
          }
          document.getElementById("detailsRuntime").textContent = runtime;

          // Rating stars
          let rating = "Rating: N/A";
          if (detailsJson?.ratings?.rating) {
            const r = detailsJson.ratings.rating;
            const stars = "★".repeat(Math.round(r)) + "☆".repeat(10 - Math.round(r));
            rating = `Rating: ${r}/10  ${stars}`;
          }
          document.getElementById("detailsRating").textContent = rating;

          detailsBox.style.display = "block";
        };

        resultsBox.appendChild(item);

      } catch (err) {
        errorBox.textContent = "Network error";
        errorBox.style.display = "block";
        detailsBox.style.display = "none";
      }
    });
  </script>

</body>
</html>
