<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Lookup</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 20px;
      font-weight: 600;
    }

    #searchBox {
      width: 300px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      margin-bottom: 20px;
    }

    #result {
      margin-top: 30px;
      width: 320px;
      background: #222;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    #poster {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .year {
      font-size: 16px;
      opacity: 0.7;
    }

    #error {
      margin-top: 20px;
      color: #ff6b6b;
      font-size: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Movie Lookup</h1>

  <input id="searchBox" type="text" placeholder="Search for a movie…">

  <div id="result">
    <img id="poster" src="" alt="Poster">
    <div class="title" id="title"></div>
    <div class="year" id="year"></div>
  </div>

  <div id="error"></div>

  <script>
    const input = document.getElementById("searchBox");
    const resultBox = document.getElementById("result");
    const errorBox = document.getElementById("error");

    input.addEventListener("keyup", async (e) => {
      const title = e.target.value.trim();
      if (!title) {
        resultBox.style.display = "none";
        errorBox.style.display = "none";
        return;
      }

      try {
        const res = await fetch(`/api/movie?title=${encodeURIComponent(title)}`);
        const data = await res.json();

        if (!data.ok) {
          errorBox.textContent = data.error;
          errorBox.style.display = "block";
          resultBox.style.display = "none";
          return;
        }

        errorBox.style.display = "none";

        document.getElementById("poster").src = data.poster || "";
        document.getElementById("title").textContent = data.title;
        document.getElementById("year").textContent = data.year || "Unknown";

        resultBox.style.display = "block";

      } catch (err) {
        errorBox.textContent = "Network error";
        errorBox.style.display = "block";
        resultBox.style.display = "none";
      }
    });
  </script>

</body>
</html>
