<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Lookup</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 20px;
      font-weight: 600;
    }

    #searchBox {
      width: 300px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      margin-bottom: 20px;
    }

    #results {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .resultItem {
      background: #222;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .resultItem:hover {
      background: #333;
    }

    #details {
      margin-top: 30px;
      width: 360px;
      background: #222;
      padding: 20px;
      border-radius: 10px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #detailsPoster {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    #detailsTitle {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    #detailsYear {
      font-size: 18px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    #error {
      margin-top: 20px;
      color: #ff6b6b;
      font-size: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Movie Lookup</h1>

  <input id="searchBox" type="text" placeholder="Search for a movie…">

  <div id="results"></div>

  <div id="details">
    <img id="detailsPoster" src="" alt="Poster">
    <div id="detailsTitle"></div>
    <div id="detailsYear"></div>
  </div>

  <div id="error"></div>

  <script>
    const input = document.getElementById("searchBox");
    const resultsBox = document.getElementById("results");
    const detailsBox = document.getElementById("details");
    const errorBox = document.getElementById("error");

    input.addEventListener("keyup", async (e) => {
      const title = e.target.value.trim();
      resultsBox.innerHTML = "";
      detailsBox.style.display = "none";
      errorBox.style.display = "none";

      if (!title) return;

      try {
        const res = await fetch(`/api/movie?title=${encodeURIComponent(title)}`);
        const data = await res.json();

        if (!data.ok) {
          errorBox.textContent = data.error;
          errorBox.style.display = "block";
          return;
        }

        // Create clickable result item
        const item = document.createElement("div");
        item.className = "resultItem";
        item.textContent = `${data.title} (${data.year || "?"})`;

        item.onclick = () => {
          document.getElementById("detailsPoster").src = data.poster || "";
          document.getElementById("detailsTitle").textContent = data.title;
          document.getElementById("detailsYear").textContent = data.year || "Unknown";
          detailsBox.style.display = "block";
        };

        resultsBox.appendChild(item);

      } catch (err) {
        errorBox.textContent = "Network error";
        errorBox.style.display = "block";
      }
    });
  </script>

</body>
</html>
